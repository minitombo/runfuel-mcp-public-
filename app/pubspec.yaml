publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  image_gallery_saver_plus: ^5.1.1
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  flutter_markdown: ^0.7.7+1
  pdf: ^3.11.3
  http: ^1.6.0
  workmanager: ^0.10.10
  app_links: ^6.4.1
  webview_flutter: ^4.14.1
  crypto: ^3.0.6
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
